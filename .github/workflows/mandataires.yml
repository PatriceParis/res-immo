name: Collecte des réseaux de mandataires

# IAD et Capifrance publient leurs propres mandats, avec une page par bien et
# un sitemap à l'intention des robots. Mesuré chez IAD : 94 216 annonces dont
# 44 318 dans nos terroirs — quarante-cinq fois le catalogue d'alors.
#
# Deux fois par jour, aux heures creuses. On ne cherche pas à tout ramener
# d'un coup : chaque passage prend les départements vus il y a le plus
# longtemps, quelques dizaines d'annonces chacun, en espaçant les requêtes.
# Le tour se fait en plusieurs jours, et c'est très bien ainsi — un balayage
# massif d'un site tiers ne serait ni nécessaire ni courtois.

on:
  workflow_dispatch:
    inputs:
      reseau:
        description: "iad, capifrance, ou vide pour les deux"
        required: false
        default: ""
      minutes:
        description: "Budget de temps"
        required: false
        default: "20"
      departements:
        description: "Codes séparés par des virgules (vide = tour normal)"
        required: false
        default: ""
      max_par_departement:
        # Le tour normal en lit 25 par département et par passage : de quoi
        # avancer partout sans jamais peser sur personne. Mais pour rattraper
        # un département resté en arrière — la Saône-et-Loire compte 1 333
        # annonces IAD à elle seule — 25 ne suffit pas, et il fallait jusqu'ici
        # modifier le script pour y toucher. L'espacement entre deux pages,
        # lui, ne bouge pas : c'est lui qui rend la chose courtoise.
        description: "Annonces lues par département (défaut 25)"
        required: false
        default: ""
  schedule:
    # Juste APRÈS les créneaux de la collecte d'agences (2 h et 14 h), jamais
    # avant : les trois workflows partagent un verrou d'écriture, et celui-ci
    # a fait manquer deux passages de collecte en tenant le verrou trop
    # longtemps. La collecte d'agences tourne six fois par jour et prime.
    - cron: "0 3,15 * * *"

permissions:
  contents: write

# Même verrou que la collecte des agences : tous écrivent dans data/ et
# committent sur main. Deux en même temps se perdraient mutuellement.
concurrency:
  group: donnees-refuge
  cancel-in-progress: false

jobs:
  mandataires:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt

      - name: Collecter
        env:
          RESEAU: ${{ github.event.inputs.reseau }}
          MINUTES: ${{ github.event.inputs.minutes }}
          DEPTS: ${{ github.event.inputs.departements }}
          MAXDEPT: ${{ github.event.inputs.max_par_departement }}
          PYTHONUNBUFFERED: "1"
        run: |
          OPTIONS="--minutes ${MINUTES:-20}"
          if [ -n "$RESEAU" ]; then OPTIONS="$OPTIONS --reseau $RESEAU"; fi
          if [ -n "$DEPTS" ]; then OPTIONS="$OPTIONS --departements $DEPTS"; fi
          if [ -n "$MAXDEPT" ]; then OPTIONS="$OPTIONS --max-par-departement $MAXDEPT"; fi
          # Même garde-fou que la collecte d'agences : la commande s'arrête à
          # coup sûr, pour que l'export ait toujours lieu.
          timeout --kill-after=30s 26m python scripts/collecter_mandataires.py $OPTIONS || true

      - name: Enrichir les risques officiels (Géorisques)
        # Moins qu'à la collecte d'agences : ce travail tient le verrou
        # d'écriture partagé, et un passage mandataires qui déborde fait
        # manquer son tour à la collecte suivante.
        run: python scripts/enrichir_risques.py --max 80 || true

      - name: Vérifier que chaque photo se charge et montre bien une maison
        run: python scripts/verifier_photos.py || true

      - name: Auditer la cohérence des données collectées
        run: python scripts/auditer.py || true

      - name: Exporter et committer
        run: |
          python scripts/exporter_reel.py
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "refuge-immo-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/
            N=$(python -c "import json; print(len(json.load(open('data/annonces_reel.json'))))" 2>/dev/null || echo 0)
            git commit -m "Mandataires : $N annonces au catalogue ($(date -u +%F))"
            for essai in 1 2 3 4 5; do
              if git push; then echo "Poussé (essai $essai)."; break; fi
              echo "Push rejeté, on se replace sur la version distante ($essai/5)…"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; git reset --hard origin/main; }
              sleep $((essai * 5))
            done
          else
            echo "Aucune annonce nouvelle."
          fi
