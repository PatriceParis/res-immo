name: Vérification des liens d'annonces

# Chaque fiche promet « voir l'annonce d'origine ». Quand le bien est vendu,
# beaucoup de sites suppriment ou redirigent la page — et la règle de sortie
# ne le voit pas sur les gros départements, tronqués à chaque passage. Ce
# passage vérifie les liens en rotation (suspects d'abord), note les constats,
# et l'export retire au DEUXIÈME constat — jamais au premier : un site peut
# tousser une heure sans que ses annonces soient mortes.

on:
  workflow_dispatch:
    inputs:
      cibles:
        description: "Ne vérifier que les URL contenant ce texte (vide = rotation)"
        required: false
        default: ""
      max:
        description: "Liens vérifiés (défaut 150)"
        required: false
        default: ""
      minutes:
        description: "Budget de temps en minutes, chiffres seuls (défaut 15)"
        required: false
        default: ""
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

concurrency:
  group: donnees-refuge
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    # Plafond FIXE, jamais calculé. Une expression à cet endroit est évaluée
    # par GitHub AVANT le premier pas : si elle échoue, le run est créé puis
    # meurt en zéro seconde, sans job, sans étape — donc sans aucune de nos
    # traces, et le cron cesse de se déclencher. C'est ce qui a mis ce passage
    # à l'arrêt du 23 au 26 septembre, avec
    # `timeout-minutes: ${{ fromJSON(github.event.inputs.minutes || '15') + 25 }}` :
    # deux runs à 0 s, 0 job, et plus une seule exécution programmée.
    #
    # Le vrai budget reste réglable, mais là où il est visible et testable :
    # dans le shell, où MINUTES est déjà ramené à des chiffres et vaut 15 par
    # défaut. Ce plafond-ci n'est qu'un filet de dernier recours — 150 comme
    # dans rattrapage.yml, pour qu'un rattrapage manuel d'un réseau entier
    # tienne dedans.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt
      - name: Vérifier les liens
        env:
          CIBLES: ${{ github.event.inputs.cibles }}
          MAXI: ${{ github.event.inputs.max }}
          MINUTES: ${{ github.event.inputs.minutes }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Une saisie non numérique donnerait un filet « m » sans nombre,
          # c'est-à-dire sans limite : on retombe sur le budget par défaut.
          case "${MINUTES}" in ''|*[!0-9]*) MINUTES=15 ;; esac
          OPTIONS="--max ${MAXI:-150} --minutes $MINUTES"
          if [ -n "$CIBLES" ]; then OPTIONS="$OPTIONS --cibles $CIBLES"; fi
          # Le filet laisse dix minutes de marge : le script regarde son budget
          # ENTRE deux liens, il peut donc le dépasser d'une requête.
          timeout --kill-after=30s "$((MINUTES + 10))m" \
                  python scripts/verifier_liens.py $OPTIONS || true
      - name: Exporter et committer
        run: |
          # Une étape `run` tourne sous `bash -e` : un export sorti en erreur
          # tuait l'étape ICI, avant même le marquage, et le passage
          # disparaissait sans un mot. C'est ce qui a rendu le créneau du
          # 23 septembre indiscernable d'un run qui n'a jamais démarré — la
          # faute déjà refermée dans collecte.yml le 29 août, qui dormait ici
          # sous la même forme. On recueille le code au lieu de le subir.
          CODE_EXPORT=0
          python scripts/exporter_reel.py || CODE_EXPORT=$?
          if [ "$CODE_EXPORT" -ne 0 ]; then
            echo "::error::Export sorti EN ERREUR (code $CODE_EXPORT) — le catalogue de ce passage ne sera pas publié, seuls ses journaux partiront."
          fi
          # Marquer avant d'indexer : un passage qui n'a trouvé aucun lien mort
          # doit laisser une trace, faute de quoi son silence est indiscernable
          # d'une panne. Voir scripts/marquer_passage.py.
          python scripts/marquer_passage.py liens || true
          # Le catalogue ne part QUE si l'export l'a reconstruit : sinon le
          # fichier resté sur le disque n'est plus digne de foi. Les journaux,
          # eux, décrivent ce passage-ci et partent dans tous les cas.
          A_INDEXER="data/liens_morts.json data/liens_verifies.json data/dernier_passage_liens.json"
          if [ "$CODE_EXPORT" -eq 0 ]; then
            A_INDEXER="data/annonces_reel.json $A_INDEXER"
          fi
          # N'indexer que ce qui existe. « git add » sur un chemin absent sort
          # en 128 SANS RIEN INDEXER : un seul journal manquant tuait l'étape
          # entière, catalogue compris.
          for f in $A_INDEXER; do
            if [ -f "$f" ]; then git add "$f"; else echo "$f absent."; fi
          done
          if [ -n "$(git diff --cached --name-only)" ]; then
            git config user.name "refuge-immo-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            N=$(python -c "import json; print(len(json.load(open('data/annonces_reel.json'))))" 2>/dev/null || echo 0)
            # Le libellé distingue les deux cas : la surveillance cherche
            # « ^Liens vérifiés », un passage qui n'a rien publié ne doit pas
            # s'en réclamer, mais il doit rester VISIBLE.
            if [ "$CODE_EXPORT" -eq 0 ]; then
              LIBELLE="Liens vérifiés : $N annonces au catalogue ($(date -u +%F))"
            else
              LIBELLE="Liens : passage sans publication (export $CODE_EXPORT, $(date -u +%F\ %H:%MZ))"
            fi
            git commit -m "$LIBELLE"
            # Se replacer, c'est REFAIRE l'export sur la version distante — les
            # journaux de CE passage sont remis d'abord, car l'export les lit.
            # Voir collecte.yml pour l'incident qui a fixé ce motif.
            for essai in 1 2 3 4 5; do
              if git push; then echo "Poussé (essai $essai)."; break; fi
              echo "Push rejeté, on se replace sur la version distante ($essai/5)…"
              for f in liens_morts.json liens_verifies.json; do
                cp "data/$f" "$RUNNER_TEMP/$f" 2>/dev/null || true
              done
              git fetch origin main
              git reset --hard origin/main
              for f in liens_morts.json liens_verifies.json; do
                cp "$RUNNER_TEMP/$f" "data/$f" 2>/dev/null || true
              done
              python scripts/exporter_reel.py || CODE_EXPORT=$?
              python scripts/marquer_passage.py liens || true
              N=$(python -c "import json; print(len(json.load(open('data/annonces_reel.json'))))" 2>/dev/null || echo 0)
              for f in $A_INDEXER; do
                if [ -f "$f" ]; then git add "$f"; fi
              done
              git commit -m "$LIBELLE" || true
              sleep $((essai * 5))
            done
          else
            echo "Aucun changement."
          fi
