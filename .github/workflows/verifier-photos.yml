name: Vérifier toutes les photos

# Repasse sur TOUT le catalogue publié et n'y laisse que des images qui se
# chargent et ressemblent à des photographies.
#
# La vérification tourne normalement dans la collecte, mais celle-ci ne voit
# que les annonces du jour. Ce workflow rattrape les autres — utile après
# l'avoir mise en place, et chaque fois qu'on veut repartir d'un catalogue
# propre.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # le lundi, après la nuit

permissions:
  contents: write

# Il réécrit data/, comme la collecte : un seul de ces travaux à la fois.
concurrency:
  group: donnees-refuge
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt

      - name: Vérifier chaque photo du catalogue
        run: python scripts/verifier_photos.py --json data/annonces_reel.json

      - name: Committer si des photos ont changé
        run: |
          if [ -n "$(git status --porcelain data/annonces_reel.json)" ]; then
            git config user.name "refuge-immo-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/annonces_reel.json
            N=$(python -c "import json; b=json.load(open('data/annonces_reel.json')); print(sum(1 for x in b if x.get('photo')))")
            git commit -m "Photos vérifiées : $N annonces illustrées ($(date -u +%F))"
            for essai in 1 2 3 4 5; do
              if git push; then echo "Poussé (essai $essai)."; break; fi
              echo "Push rejeté, on reprend la version distante ($essai/5)…"
              git fetch origin main
              git reset --hard origin/main
              python scripts/verifier_photos.py --json data/annonces_reel.json
              git add data/annonces_reel.json
              git commit -m "Photos vérifiées ($(date -u +%F))" || true
              sleep $((essai * 5))
            done
          else
            echo "Aucune photo à corriger."
          fi
