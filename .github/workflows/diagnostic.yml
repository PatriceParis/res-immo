name: Diagnostic photo

# Ouvre une ou plusieurs annonces dans le vrai navigateur et rapporte ce que
# la page contient : images présentes, verdict de chaque filtre, et l'effet
# d'une attente plus longue.
#
# Ce workflow existe parce que le poste de développement n'a pas le réseau :
# sans lui, tout diagnostic d'image se fait à l'aveugle — ce qui a déjà coûté
# trois correctifs successifs sur des noms de fichiers.
#
# Il ne touche à AUCUNE donnée : il lit, il affiche. Il ne prend donc pas le
# verrou « donnees-refuge » et peut tourner pendant une collecte.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL d'annonces à sonder, séparées par des espaces"
        required: false
        default: ""
      mandataire:
        description: "Domaines ou annonces de réseaux de mandataires à évaluer (séparés par des espaces)"
        required: false
        default: ""
      relais:
        description: "Comparer direct / relais : nom d'agence, URLs d'annonces, ou 'echantillon'"
        required: false
        default: ""

jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Sonder les photos d'une annonce
        if: github.event.inputs.urls != ''
        run: python scripts/diagnostiquer_photo.py ${{ github.event.inputs.urls }}

      - name: Évaluer un réseau de mandataires comme source d'annonces
        if: github.event.inputs.mandataire != ''
        run: python scripts/explorer_mandataire.py ${{ github.event.inputs.mandataire }}

      - name: Comparer ce que voit la vérification et ce que voit le visiteur
        # La vérification ouvre les images EN DIRECT depuis le runner ; le
        # visiteur les reçoit par /api/photo, notre relais sur Vercel. Deux
        # chemins, deux résultats possibles — d'où des fiches réputées
        # illustrées qui restent au dessin de repli.
        if: github.event.inputs.relais != ''
        env:
          CIBLE: ${{ github.event.inputs.relais }}
        run: |
          if [ "$CIBLE" = "echantillon" ]; then
            python scripts/diagnostiquer_relais.py --echantillon 25
          elif [ "${CIBLE#http}" != "$CIBLE" ]; then
            python scripts/diagnostiquer_relais.py $CIBLE
          else
            python scripts/diagnostiquer_relais.py --agence "$CIBLE"
          fi
