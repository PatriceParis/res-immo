name: Collecte d'annonces réelles

# Récupère de vraies annonces chez les agences (via un vrai navigateur Chromium),
# les exporte, puis les committe : le site Vercel se met alors à jour tout seul.
#
# Deux façons de la lancer :
#   • à la main : onglet « Actions » → « Collecte d'annonces réelles » →
#     « Run workflow » (on peut y saisir des sites d'agences précis) ;
#   • automatiquement : toutes les quatre heures (voir cron ci-dessous).
#
# Pourquoi si souvent ? La collecte s'arrête sur un budget de temps : elle
# visite une quinzaine d'agences par passage, en commençant par celles vues il
# y a le plus longtemps. L'annuaire est passé de 53 à 235 agences — un
# passage par jour demanderait DIX-SEPT JOURS pour boucler le tour, et un bien
# vendu resterait affiché deux semaines et demie. Six passages par jour
# ramènent le tour à trois jours.
#
# Six passages espacés de quatre heures, et non six jobs parallèles : un
# passage dure environ quarante minutes, ils ne se chevauchent donc jamais.
# C'est ce qui compte, car deux jobs qui committent le même fichier
# d'annonces en même temps se perdraient mutuellement — la reprise après
# conflit remet en place SA version. Le jour où il faudra vraiment
# paralléliser, il faudra passer par des artefacts et une fusion finale,
# comme le fait déjà le workflow de recensement.

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Sites d'agences séparés par des espaces (vide = annuaire agences.json). Ex: https://agence.fr"
        required: false
        default: ""
      index:
        description: "Page listant les annonces d'un site (optionnel, si un seul site)"
        required: false
        default: ""
      max:
        description: "Nombre de biens max par agence (défaut 12)"
        required: false
        default: "12"
  schedule:
    - cron: "0 2,6,10,14,18,22 * * *"   # toutes les 4 h

permissions:
  contents: write

# Un seul de ces travaux à la fois : collecte, découverte et recensement
# écrivent tous dans data/ et committent sur main. Deux qui tournent ensemble
# se disputeraient le fichier — et la reprise après conflit d'un workflow peut
# écraser le travail de l'autre. Ce garde-fou vaut aussi pour l'usage des
# minutes : rien ne tourne en double.
concurrency:
  group: donnees-refuge
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    # Le budget interne du collecteur est de 28 minutes, l'enrichissement et
    # l'export en prennent une dizaine. Soixante laissent de la marge : quatre
    # passages de suite ont été TUÉS à cinquante minutes, juste avant l'export
    # — le travail était fait, puis jeté. Mieux vaut tenir le verrou un peu
    # plus longtemps que perdre une collecte entière.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Collecter les annonces (vrai navigateur)
        env:
          SITES: ${{ github.event.inputs.sites }}
          INDEX: ${{ github.event.inputs.index }}
          MAXIN: ${{ github.event.inputs.max }}
          # Sans cela, Python met sa sortie en tampon quand elle part dans un
          # fichier : à l'annulation, TOUT le journal est perdu. Cinq passages
          # de suite ont ainsi été tués sans laisser la moindre trace de ce
          # qu'ils faisaient — impossible de savoir où le temps partait.
          PYTHONUNBUFFERED: "1"
        run: |
          # Douze biens par agence et par passage, contre huit jusqu'ici.
          #
          # Huit avait un effet pervers, mesuré : une agence qui en a davantage
          # ne voyait jamais rechercher les autres, qui prenaient pourtant une
          # absence à chaque visite et finissaient supprimées alors qu'elles
          # étaient toujours en ligne. Deux cent quarante et une annonces
          # étaient dans ce cas, et le catalogue perdait une vingtaine de biens
          # par jour — 1619 le 15 août au matin, 1594 le 16.
          #
          # Douze ne supprime pas ce défaut, il en réduit la portée : les
          # agences de neuf à douze biens deviennent parcourues en entier, donc
          # leurs absences redeviennent vraies. Il coûte en revanche du temps
          # par agence, donc moins d'agences par passage et une rotation plus
          # lente. À surveiller dans le déroulé : si le nombre d'agences
          # visitées tombe nettement sous quinze, le prix est trop élevé.
          MAX="${MAXIN:-12}"
          # `timeout` est le garde-fou de dernier recours. Le collecteur a son
          # propre budget de vingt-huit minutes, mais il l'a dépassé deux fois
          # — jusqu'à cinquante-neuf minutes — par une attente qu'il ne
          # surveillait pas. Le job entier était alors tué AVANT l'export, et
          # tout le travail jeté. Ici, la commande s'arrête à coup sûr, et les
          # étapes suivantes — enrichissement, vérification, export — ont
          # toujours lieu. Mieux vaut une collecte écourtée qu'une collecte
          # perdue.
          #
          # `|| true` laissait en outre passer l'échec SANS RIEN DIRE. Deux
          # passages programmés n'ont ainsi rien poussé, et le journal ne
          # permettait même pas de distinguer un collecteur qui plante d'un
          # collecteur coupé par le garde-fou. On continue de ne pas faire
          # échouer le job — l'export doit avoir lieu — mais on le DIT.
          collecter() {
            set +e
            timeout --kill-after=30s 34m python scripts/collecter_navigateur.py "$@"
            code=$?
            set -e
            case "$code" in
              0) echo "Collecteur terminé normalement." ;;
              124|137)
                echo "::warning::Collecteur ARRÊTÉ par le garde-fou de temps (code $code) : plus de 34 min. L'export suit." ;;
              *)
                echo "::error::Collecteur sorti EN ERREUR (code $code) — voir la trace ci-dessus. L'export suit." ;;
            esac
            # Le code de sortie doit survivre jusqu'à l'étape d'export : c'est
            # lui qui distingue « le passage n'a pas eu lieu » de « le passage
            # a eu lieu et n'a rien ramené ». On garde le pire des codes.
            if [ "$code" -ne 0 ]; then echo "$code" > "$RUNNER_TEMP/code_collecteur"; fi
          }
          echo 0 > "$RUNNER_TEMP/code_collecteur"
          if [ -n "$SITES" ]; then
            for s in $SITES; do
              echo "== $s =="
              if [ -n "$INDEX" ]; then
                collecter -s "$s" --index "$INDEX" --max "$MAX"
              else
                collecter -s "$s" --max "$MAX"
              fi
            done
          else
            collecter --max "$MAX"
          fi

      - name: Enrichir les risques officiels (Géorisques)
        # API publique de l'État : zone inondable, argiles, feux de forêt…
        # Non bloquant : sans réseau ou si l'API change, on garde l'existant.
        run: python scripts/enrichir_risques.py --max 200 || true

      - name: Vérifier que chaque photo se charge et montre bien une maison
        # On OUVRE réellement chaque image avant de la publier. Sans cela, une
        # adresse morte laissait la fiche vide alors que la photo existait, et
        # une étiquette DPE — servie par le même script que les vraies photos,
        # donc indiscernable sur l'adresse — passait pour la maison.
        # Non bloquant : mieux vaut publier la collecte avec quelques
        # illustrations de repli que ne rien publier du tout.
        run: python scripts/verifier_photos.py || true

      - name: Auditer la cohérence des données collectées
        # Les anomalies qui comptent ici ne font pas planter le site : elles le
        # rendent faux (surface de piscine lue comme habitable, bien compté
        # dans le total mais rattaché à aucune pastille de terroir…). Aucun
        # test unitaire ne les attrape, elles naissent des vraies données.
        # Non bloquant : le rapport s'affiche dans le journal du run, et une
        # collecte imparfaite reste préférable à pas de collecte du tout.
        run: python scripts/auditer.py || true

      - name: Exporter et committer si des annonces ont été trouvées
        run: |
          # Une étape `run` tourne sous `bash -e` : un export sorti en erreur
          # tuait l'étape ICI, avant même le calcul de N, donc avant la trace.
          # Le passage disparaissait alors sans un mot. On recueille le code au
          # lieu de le subir — comme le fait déjà le collecteur plus haut.
          CODE_EXPORT=0
          python scripts/exporter_reel.py || CODE_EXPORT=$?
          if [ "$CODE_EXPORT" -ne 0 ]; then
            echo "::error::Export sorti EN ERREUR (code $CODE_EXPORT) — le catalogue de ce passage ne sera pas publié."
          fi
          N=$(python -c "import json; print(len(json.load(open('data/annonces_reel.json'))))" 2>/dev/null || echo 0)
          echo "Annonces réelles collectées : $N"
          # TOUJOURS laisser une trace dans le dépôt, même quand la collecte
          # n'a rien changé. Quatre passages programmés de suite n'ont rien
          # poussé : impossible, depuis le seul journal git, de distinguer un
          # passage qui n'a pas eu lieu d'un passage qui n'a rien trouvé. Ce
          # fichier tranche, et il tient dans une ligne.
          CODE=$(cat "$RUNNER_TEMP/code_collecteur" 2>/dev/null || echo "?")
          python - "$N" "$CODE" "$CODE_EXPORT" <<'PY'
          import json, subprocess, sys, datetime, pathlib
          annonces, code, code_export = sys.argv[1], sys.argv[2], sys.argv[3]
          vus = subprocess.run(["git", "diff", "--name-only", "--", "data/"],
                               capture_output=True, text=True).stdout.split()
          pathlib.Path("data/dernier_passage.json").write_text(json.dumps({
              "quand": datetime.datetime.now(datetime.timezone.utc)
                       .replace(microsecond=0).isoformat(),
              "code_collecteur": code,
              "code_export": code_export,
              "annonces_au_catalogue": int(annonces),
              "fichiers_modifies": sorted(vus),
          }, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")
          PY
          if [ "$N" -gt 0 ]; then
            git config user.name "refuge-immo-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Le journal des visites porte la ROTATION : sans lui, la collecte
            # repartirait toujours des mêmes premières agences et ne
            # reviendrait jamais aux dernières.
            #
            # N'indexer que ce qui existe. « git add » sur un chemin absent
            # sort en 128 SANS RIEN INDEXER : sous `bash -e`, un seul journal
            # manquant tuait donc l'étape entière, catalogue compris, et le
            # passage ne poussait rien du tout. C'est la faute qui avait déjà
            # empêché `sites.yml` de committer une seule fois depuis sa
            # création ; elle dormait ici sous la même forme.
            for f in data/annonces_reel.json data/agences_visitees.json \
                     data/dernier_passage.json data/deroule_collecte.json \
                     data/visites_tronquees.json; do
              if [ -f "$f" ]; then git add "$f"; else echo "$f absent."; fi
            done
            # Le libellé distingue les deux cas, car la surveillance cherche
            # « ^Collecte auto » : un passage stérile ne doit pas passer pour
            # une collecte réussie, mais il doit rester VISIBLE.
            if git diff --cached --quiet -- data/annonces_reel.json data/agences_visitees.json; then
              git commit -m "Collecte : passage sans résultat (code $CODE, $(date -u +%F\ %H:%MZ))" \
                || echo "Aucun changement."
            else
              git commit -m "Collecte auto : $N annonces réelles ($(date -u +%F))" \
                || echo "Aucun changement."
            fi
            # La collecte dure ~20 min : un commit poussé pendant ce temps fait
            # rejeter ce push. On se replace alors sur la version distante et
            # on REFAIT l'export par-dessus elle.
            #
            # Recopier notre fichier sur celui du dépôt, comme on le faisait,
            # n'était pas se replacer : c'était écraser. Le 17 août, la
            # collecte de 7 h 46 a ainsi effacé les 175 annonces IAD de
            # Saône-et-Loire que le passage mandataires venait d'ajouter — le
            # catalogue est passé de 199 à 24 pour ce département, revenant
            # exactement à la valeur d'avant. Aucune alerte : le fichier avait
            # l'air normal, il était simplement en retard d'un passage.
            #
            # Refaire l'export est la seule fusion correcte, parce qu'il passe
            # par `historique.fusionner` : le fichier distant devient le
            # « précédent », notre base le « nouveau », et la règle de sortie
            # ne touche QUE les cibles réellement visitées par ce passage. Ce
            # qu'un autre collecteur a rapporté pendant ce temps est conservé
            # par construction, sans que personne ait à y penser.
            #
            # La base (data/refuge.db, ignorée par git) survit au reset : c'est
            # elle qui porte notre récolte, pas le fichier exporté.
            for essai in 1 2 3 4 5; do
              if git push; then
                echo "Poussé (essai $essai)."
                break
              fi
              echo "Push rejeté : la branche a bougé pendant la collecte, on se replace dessus ($essai/5)…"
              # Ces quatre journaux décrivent NOTRE passage et n'appartiennent
              # qu'à lui : on les remet tels quels. Le catalogue, lui, est
              # commun — il se refusionne, il ne se recopie pas.
              for f in agences_visitees.json dernier_passage.json \
                       deroule_collecte.json visites_tronquees.json; do
                cp "data/$f" "$RUNNER_TEMP/$f" 2>/dev/null || true
              done
              git fetch origin main
              git reset --hard origin/main
              for f in agences_visitees.json dernier_passage.json \
                       deroule_collecte.json visites_tronquees.json; do
                cp "$RUNNER_TEMP/$f" "data/$f" 2>/dev/null || true
              done
              # `visites_tronquees.json` doit être en place AVANT : l'export le
              # lit pour savoir sur quelles cibles s'abstenir.
              python scripts/exporter_reel.py || echo "::error::Export refait EN ERREUR — cet essai ne publiera pas."
              N=$(python -c "import json; print(len(json.load(open('data/annonces_reel.json'))))" 2>/dev/null || echo 0)
              for f in data/annonces_reel.json data/agences_visitees.json \
                       data/dernier_passage.json data/deroule_collecte.json \
                       data/visites_tronquees.json; do
                if [ -f "$f" ]; then git add "$f"; fi
              done
              git commit -m "Collecte auto : $N annonces réelles ($(date -u +%F))" || true
              sleep $((essai * 5))
            done
          else
            echo "Aucune annonce collectée (les sites ont peut-être bloqué, ou aucune URL d'annonce trouvée)."
            echo "Astuce : relancez en indiquant des 'sites' d'agences et éventuellement une page 'index' de leurs biens."
            # Un passage sans catalogue reste un passage. La trace était bien
            # écrite juste au-dessus, mais elle n'était indexée que dans la
            # branche d'à côté : ce chemin-ci ne poussait RIEN, et le journal
            # git — seul signal de surveillance des tâches programmées — ne
            # permettait plus de distinguer ce passage d'un run qui n'a jamais
            # démarré. Du 27 au 29 août, quatre créneaux sur six sont restés
            # muets de cette façon.
            #
            # On ne pousse ici que les journaux de diagnostic. Le catalogue,
            # lui, n'a pas été reconstruit : le fichier présent sur le disque
            # n'est plus digne de foi et ne doit surtout pas partir.
            git config user.name "refuge-immo-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            LIBELLE="Collecte : passage sans publication (collecteur $CODE, export $CODE_EXPORT, $(date -u +%F\ %H:%MZ))"
            for f in data/dernier_passage.json data/deroule_collecte.json; do
              if [ -f "$f" ]; then git add "$f"; else echo "$f absent."; fi
            done
            if [ -n "$(git diff --cached --name-only)" ]; then
              git commit -m "$LIBELLE" || echo "Aucun changement."
              for essai in 1 2 3; do
                if git push; then echo "Trace poussée (essai $essai)."; break; fi
                echo "Push rejeté : la branche a bougé, on se replace dessus ($essai/3)…"
                for f in dernier_passage.json deroule_collecte.json; do
                  cp "data/$f" "$RUNNER_TEMP/$f" 2>/dev/null || true
                done
                git fetch origin main
                git reset --hard origin/main
                for f in dernier_passage.json deroule_collecte.json; do
                  cp "$RUNNER_TEMP/$f" "data/$f" 2>/dev/null || true
                  if [ -f "data/$f" ]; then git add "data/$f"; fi
                done
                git commit -m "$LIBELLE" || echo "Aucun changement."
                sleep $((essai * 5))
              done
            fi
          fi
